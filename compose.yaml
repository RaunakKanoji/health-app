services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: careloop
      POSTGRES_PASSWORD: careloop
      POSTGRES_DB: careloop
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - careloop_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U careloop -d careloop']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  careloop_postgres:
