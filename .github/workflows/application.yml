name: CareLoop application
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: careloop
          POSTGRES_PASSWORD: careloop
          POSTGRES_DB: careloop
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U careloop -d careloop"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: python -m pip install -r services/ml/requirements.lock -e './services/ml[test]'
      - run: python -m pytest services/ml
      - run: pnpm simulate && pnpm evaluate
      - run: python scripts/evaluate/ml.py --seed 2026 --patients 1200 --output docs/evaluation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-verification
          path: |
            playwright-report/
            test-results/
            docs/evaluation/*results*
            docs/demo/screenshots/
